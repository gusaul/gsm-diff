<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSM Diff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <svg class="header-icon" viewBox="0 0 24 24">
          <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
        <span class="header-title">GSM Diff</span>
      </div>
      <div class="auth-pill" id="auth-status-pill">
        <span class="auth-dot" id="auth-dot"></span>
        <span id="auth-text">Checking Auth...</span>
      </div>
    </header>

    <nav class="popup-tabs">
      <button class="tab-btn active" data-tab="tab-console">Console View</button>
      <button class="tab-btn" data-tab="tab-quickdiff">Quick Diff Tool</button>
    </nav>

    <!-- Tab 1: Active Google Cloud Console Session -->
    <main class="tab-content active" id="tab-console">
      <div class="card" id="context-card">
        <div class="card-title">Active Secret Manager Context</div>
        <div class="context-details" id="context-details">
          <div class="detail-row">
            <span class="detail-label">Secret:</span>
            <span class="detail-value" id="current-secret-name">None detected</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Project:</span>
            <span class="detail-value" id="current-project-name">-</span>
          </div>
        </div>
      </div>

      <div class="actions-card" id="console-actions">
        <button class="action-btn primary" id="btn-quick-compare-top" disabled>
          ⚡ Compare Top 2 Versions
        </button>
        <button class="action-btn secondary" id="btn-open-console">
          Open Google Cloud Secret Manager
        </button>
      </div>

      <div class="tips-box">
        <strong>💡 Pro-Tip:</strong> On any Secret Manager Versions page, check any 2 versions using the checkboxes to open the side-by-side comparison modal!
      </div>
    </main>

    <!-- Tab 2: Quick Standalone Diff Tool -->
    <main class="tab-content" id="tab-quickdiff">
      <div class="quickdiff-inputs">
        <div class="input-col">
          <label>Version A / Record 1:</label>
          <textarea id="qd-text-a" placeholder="Paste old secret value or log JSON..."></textarea>
        </div>
        <div class="input-col">
          <label>Version B / Record 2:</label>
          <textarea id="qd-text-b" placeholder="Paste new secret value or log JSON..."></textarea>
        </div>
      </div>

      <div class="quickdiff-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="qd-opt-json" checked> Prettify JSON
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="qd-opt-ws"> Ignore Whitespace
        </label>
        <button class="action-btn primary" id="btn-run-quickdiff" style="margin-left: auto;">
          Compute Diff
        </button>
      </div>

      <div class="quickdiff-result" id="qd-result-container" style="display: none;">
        <div class="qd-stats" id="qd-stats"></div>
        <div class="qd-output" id="qd-output"></div>
      </div>
    </main>

    <footer class="popup-footer">
      <span>GSM Diff v1.0.0</span>
      <a href="https://cloud.google.com/secret-manager" target="_blank" class="footer-link">GCP Docs</a>
    </footer>
  </div>

  <script src="../diff-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
